name: Deploy Docs

on:
  push:
    branches:
      - master
  schedule:
    - cron: "17 23 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update page-view snapshot
        if: github.event_name != 'push'
        env:
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
          UMAMI_WEBSITE_ID: e6bcb0cd-aee7-4383-8557-9cf7564c86a0
        run: python scripts/update_pageviews.py

      - name: Commit page-view snapshot
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- docs/assets/data/pageviews.json; then
            echo "Page-view snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/pageviews.json
          git commit -m "chore: update page view snapshot [skip ci]"
          git push

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
