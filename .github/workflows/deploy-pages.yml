name: Deploy Docs

on:
  push:
    branches:
      - master
  schedule:
    - cron: "17 23 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update page-view snapshot
        if: github.event_name != 'push'
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
          GOATCOUNTER_SITE_CODE: amoursec
        run: python scripts/update_pageviews.py

      - name: Update contribution leaderboard
        run: python -m scripts.update_leaderboard

      - name: Test statistics
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.cjs

      - name: Build site
        run: mkdocs build --strict

      - name: Commit statistics and leaderboard
        run: |
          if git diff --quiet -- docs/assets/data/pageviews.json docs/13-contribution-leaderboard/index.md; then
            echo "Statistics and leaderboard unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/pageviews.json docs/13-contribution-leaderboard/index.md
          git commit -m "chore: update page views and contribution leaderboard [skip ci]"
          git push

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
