{% if page and page.meta.comments is not sameas false %}
  <section aria-labelledby="__comments">
    <h2 id="__comments">评论</h2>
    <p>使用 GitHub 账号登录后即可评论或回应。评论区未加载时，可前往
      <a href="https://github.com/{{ config.extra.giscus.repo | e }}/discussions/categories/announcements">GitHub Discussions</a>。
    </p>
    <script
      src="https://giscus.app/client.js"
      data-repo="{{ config.extra.giscus.repo | e }}"
      data-repo-id="{{ config.extra.giscus.repo_id | e }}"
      data-category="{{ config.extra.giscus.category | e }}"
      data-category-id="{{ config.extra.giscus.category_id | e }}"
      data-mapping="specific"
      data-term="{{ page.file.src_uri | e }}"
      data-strict="1"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="top"
      data-theme="light"
      data-lang="zh-CN"
      data-loading="lazy"
      crossorigin="anonymous"
      async
    ></script>
  </section>
{% endif %}
